# BSI production: the bsi-app VM (platform-api, web). See deploy/README.md.
#
#   export BSI_VERSION=1.4.0                 # image tag built by CI, never "latest"
#   docker compose -f deploy/bsi-app/compose.yml pull
#   docker compose -f deploy/bsi-app/compose.yml up -d
#
# Not here, on purpose:
#   - Postgres: company managed Postgres (or a separate VM). URLs come in the env files below.
#   - Agent containers: they run on the bsi-runner VM. platform-api starts them there through the Docker
#     API over mutual TLS; this VM never runs AI-written code.
#
# Host files (rendered from Vault by the deploy job; owner root, mode 0600 or 0400):
#   /etc/bsi/platform-api.env    BSI_DATABASE_URL, ANTHROPIC_API_KEY
#                                    (no model proxy yet: platform-api passes the key into agent containers)
#   /etc/bsi/ssh/                id_ed25519 (deploy user key), known_hosts (pinned target host keys)
#   /etc/bsi/docker-tls/         ca.pem, cert.pem, key.pem (client cert for bsi-runner's Docker API)
#   /etc/bsi/tls/                fullchain.pem, privkey.pem (HTTPS certificate)

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: 50m, max-file: "10"}

services:
  platform-api:
    <<: *hardening
    image: ${REGISTRY:-registry}/bsi/platform-api:${BSI_VERSION:?set BSI_VERSION}
    env_file: [/etc/bsi/platform-api.env]
    environment:
      BSI_MODE: prod
      BSI_SANDBOX: docker
      BSI_AGENT_IMAGE: ${REGISTRY:-registry}/bsi/agent-runner:${BSI_VERSION}
      BSI_SANDBOX_NETWORK: bsi-agent-sandbox   # created on bsi-runner, see deploy/README.md
      # Docker API of bsi-runner, mutual TLS (the docker client library reads these)
      DOCKER_HOST: tcp://${BSI_RUNNER_HOST:?set BSI_RUNNER_HOST}:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /run/docker-tls
      # How agent containers on bsi-runner reach this VM
      BSI_RUN_MCP_URL: http://${BSI_APP_HOST:?set BSI_APP_HOST}:8000/mcp/
      BSI_RUN_PLATFORM_URL: http://${BSI_APP_HOST}:8000
      BSI_MODEL: ${BSI_MODEL:-claude-opus-5-5}
      # the server tools: real SSH with the platform's key (this process holds it)
      BSI_SSH_KEY: /run/ssh/id_ed25519
      BSI_KNOWN_HOSTS: /run/ssh/known_hosts
      BSI_REGISTRY: ${REGISTRY:-registry}
      BSI_MCP_ALLOWED_HOSTS: ${BSI_APP_HOST}:*,platform-api:*
    volumes:
      - /etc/bsi/docker-tls:/run/docker-tls:ro
      - /etc/bsi/ssh:/run/ssh:ro  # the only place the SSH key exists
    ports:
      # private interface only; the firewall lets only bsi-runner in (agent containers: /runner, /mcp)
      - "${BSI_APP_PRIVATE_IP:?set BSI_APP_PRIVATE_IP}:8000:8000"


  web:
    <<: *hardening
    image: ${REGISTRY:-registry}/bsi/web:${BSI_VERSION:?set BSI_VERSION}
    tmpfs: [/tmp, /var/cache/nginx]
    volumes:
      - ./nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/bsi/tls:/etc/nginx/tls:ro
    ports:
      - "443:8443"                    # the only public port
    depends_on:
      platform-api: {condition: service_healthy}
