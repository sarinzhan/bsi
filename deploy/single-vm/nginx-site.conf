# For the nginx that is ALREADY on the server (not in Docker). It does HTTPS and the login, then
# forwards everything to the web container on 127.0.0.1:8080. That container forwards /api to platform-api.
#
#   sudo cp deploy/single-vm/nginx-site.conf /etc/nginx/sites-available/bsi
#   sudo ln -s /etc/nginx/sites-available/bsi /etc/nginx/sites-enabled/bsi
#   sudo nginx -t && sudo systemctl reload nginx
#
# Change server_name and the certificate paths. Login = nginx basic auth (stopgap until company SSO):
# the login name becomes X-User-Id, and whatever the browser sends in X-User-Id is replaced.

server {
    listen 80;
    server_name bsi.example.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name bsi.example.internal;

    ssl_certificate     /etc/ssl/bsi/fullchain.pem;     # your certificate
    ssl_certificate_key /etc/ssl/bsi/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    auth_basic           "BSI";
    auth_basic_user_file /etc/nginx/bsi.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-User-Id $remote_user;    # who logged in; never the browser's value
        proxy_set_header Authorization "";          # the password stays here
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;                        # chat events stream over SSE
        proxy_read_timeout 1h;
        client_max_body_size 2m;
    }
}
