# For the nginx that is ALREADY on the server (not in Docker). It does HTTPS and the login, then
# forwards to the web container on 127.0.0.1:8088 (docker-compose.yml). That container forwards /api to
# platform-api.
#
# Login = nginx basic auth (stopgap until company SSO): the login name becomes X-User-Id, and whatever the
# browser sends in X-User-Id is replaced. Never forward to the web container without these lines: anyone
# could then act as any user, admins included.
#
# Two ways to put it in your nginx. Afterwards: sudo nginx -t && sudo systemctl reload nginx

# ---- A. Under a path of an existing site: https://your-host/bsi/ ----
# Paste these two blocks inside that site's existing "server { ... }".
# The web image must be built with BSI_BASE_PATH=/bsi/ (README.md, "Under a path").

location = /bsi {
    return 301 /bsi/;
}

# "^~": once /bsi/ matches, nginx skips the site's regex locations (e.g. "location ~* \.(js|css)$"),
# which would otherwise send BSI's /bsi/assets/*.js to the other app.
location ^~ /bsi/ {
    auth_basic           "BSI";
    auth_basic_user_file /etc/nginx/bsi.htpasswd;

    proxy_pass http://127.0.0.1:8088/;          # trailing "/": /bsi/api/me reaches the container as /api/me
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-User-Id $remote_user;    # who logged in; never the browser's value
    proxy_set_header Authorization "";          # the password stays here
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;                        # chat events stream over SSE
    proxy_read_timeout 1h;                      # an open chat keeps one stream open
    client_max_body_size 2m;
}

# ---- B. On its own host name: https://bsi.example.internal/ ----
# Save as /etc/nginx/sites-available/bsi and link it into sites-enabled. Web image built with the default "/".
