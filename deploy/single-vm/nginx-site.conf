# For the nginx that is ALREADY on the server (not in Docker). It does HTTPS, then forwards to the web
# container on 127.0.0.1:8088 (docker-compose.yml). That container forwards /api to platform-api.
#
# Sign-in is BSI's own login page (session cookie, HttpOnly + Secure), so nginx needs no basic auth.
# Keep HTTPS: the cookie is marked Secure and the browser does not send it over plain HTTP.
#
# Two ways to put it in your nginx. Afterwards: sudo nginx -t && sudo systemctl reload nginx

# ---- A. Under a path of an existing site: https://your-host/bsi/ ----
# Paste these two blocks inside that site's existing "server { ... }".
# The web image must be built with BSI_BASE_PATH=/bsi/ (README.md, "Under a path").

location = /bsi {
    return 301 /bsi/;
}

# "^~": once /bsi/ matches, nginx skips the site's regex locations (e.g. "location ~* \.(js|css)$"),
# which would otherwise send BSI's /bsi/assets/*.js to the other app.
location ^~ /bsi/ {
    proxy_pass http://127.0.0.1:8088/;          # trailing "/": /bsi/api/me reaches the container as /api/me
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;                        # chat events stream over SSE
    proxy_read_timeout 1h;                      # an open chat keeps one stream open
    client_max_body_size 2m;
}

