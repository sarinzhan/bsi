# Routes of the public entry point, shared by the local (HTTP) and prod (TLS) server blocks.
# Only the web app and platform-api's /api are reachable from outside. Not routed on purpose:
# /runner and /mcp (agent containers only, reached on the private network).

server_tokens off;
root /usr/share/nginx/html;

# nginx drops server-level add_header in a location that has its own, so every location includes this
include /etc/nginx/snippets/security-headers.conf;

location = /healthz {
    access_log off;
    return 200 "ok\n";
}

location /api/ {
    proxy_pass http://platform-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # chat events will stream over SSE: no buffering, long reads
    proxy_buffering off;
    proxy_read_timeout 1h;
    client_max_body_size 2m;
}

# platform-api's API docs (internal tool). Delete this block if the docs must not be reachable.
location ~ ^/(docs|openapi\.json)$ {
    proxy_pass http://platform-api:8000;
    proxy_set_header Host $host;
}

# hashed build files never change: cache them for a year
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
}

# single-page app: unknown paths load index.html, the React router takes over
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
}
