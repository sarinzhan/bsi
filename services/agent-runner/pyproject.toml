[project]
name = "agent-runner"
version = "0.1.0"
description = "BSI agent-runner: the agent loop that runs inside each agent container (one per run)."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0,<2",      # the model (Claude API)
  "mcp>=2.3,<3",            # the server tools, served by platform-api (/mcp/)
  "httpx>=0.27,<1",         # platform-api: context, events, finish
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "import-linter>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

# ---- Architecture rules, checked by `lint-imports` ----
[tool.importlinter]
root_package = "agent_runner"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The loop knows no SDK: the model, the tools and platform-api are interfaces"
type = "forbidden"
source_modules = ["agent_runner.loop", "agent_runner.interfaces"]
forbidden_modules = ["anthropic", "mcp", "httpx", "agent_runner.integrations"]
