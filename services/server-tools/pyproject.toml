[project]
name = "server-tools"
version = "0.1.0"
description = "superAI server tools: the only service that holds the SSH key. Serves MCP tools to the agent."
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",          # MCP server (MCPServer, streamable HTTP)
  "fastapi>=0.115,<1",
  "uvicorn>=0.30",
  "asyncssh>=2.17",
  "httpx>=0.27",
  "pyyaml>=6",
  "sqlalchemy>=2.0.36,<3",     # ORM (sync: the ports are sync)
  "alembic>=1.14,<2",          # migrations
  "psycopg[binary]>=3.2,<4",  # Postgres driver used by SQLAlchemy
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "import-linter>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server_tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

# ---- Architecture rules, checked by `lint-imports` ----
[tool.importlinter]
root_package = "server_tools"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Every module is layered: adapters -> application -> ports -> domain"
type = "layers"
containers = ["server_tools.servers", "server_tools.tools"]
layers = ["adapters", "application", "ports", "domain"]

[[tool.importlinter.contracts]]
name = "tools sees servers only through servers.ports.provided"
type = "forbidden"
source_modules = ["server_tools.tools"]
forbidden_modules = [
  "server_tools.servers.domain",
  "server_tools.servers.application",
  "server_tools.servers.adapters",
  "server_tools.servers.ports.required",
]

[[tool.importlinter.contracts]]
name = "servers does not know about tools"
type = "forbidden"
source_modules = ["server_tools.servers"]
forbidden_modules = ["server_tools.tools"]

[[tool.importlinter.contracts]]
name = "Domain is pure: no frameworks, no I/O"
type = "forbidden"
source_modules = ["server_tools.servers.domain", "server_tools.tools.domain"]
forbidden_modules = ["mcp", "starlette", "fastapi", "pydantic", "asyncssh", "httpx", "yaml", "sqlalchemy", "alembic",
  "psycopg"]

[[tool.importlinter.contracts]]
name = "Use cases and ports know no web framework and no database library (those belong in adapters)"
type = "forbidden"
source_modules = ["server_tools.servers.application", "server_tools.servers.ports",
                  "server_tools.tools.application", "server_tools.tools.ports"]
forbidden_modules = ["fastapi", "starlette", "pydantic", "sqlalchemy", "alembic", "psycopg", "mcp", "asyncssh", "httpx"]
