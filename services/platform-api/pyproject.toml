[project]
name = "platform-api"
version = "0.1.0"
description = "BSI platform-api: one process with the modules access, servers, agent, chat, approval and tools (MCP)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30",
  "pyyaml>=6",
  "sqlalchemy>=2.0.36,<3",     # ORM (sync: the ports are sync)
  "alembic>=1.14,<2",          # migrations
  "psycopg[binary]>=3.2,<4",  # Postgres driver used by SQLAlchemy
  "docker>=7.1,<8",           # agent containers (Docker API)
  "mcp>=2.3,<3",              # the server tools agents call (MCP server at /mcp/)
  "asyncssh>=2.17,<3",        # runs the tools on servers (the SSH key lives in this process)
  "pyjwt>=2.10,<3",           # sign-in tokens (HS256)
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "import-linter>=2.1", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

# ---- Architecture rules, checked by `lint-imports` ----
# Every module has the same layers:  router -> service -> repositories / integrations -> models
#   router.py        HTTP (or MCP) in, calls the service
#   service.py       business logic; needs storage and outside systems only through interfaces.py
#   schemas.py       what the service returns to callers, and its errors
#   interfaces.py    what the service needs (repositories, sandbox, SSH...)
#   models.py        entities and rules, plain Python
#   repositories/    storage (Postgres, memory, files);  integrations/  everything else outside
# A module uses another module only through that module's schemas.py. Wiring is in main.py and wiring.py.
[tool.importlinter]
root_package = "platform_api"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "access: layers (router, repositories, integrations -> service -> interfaces, schemas -> models)"
type = "layers"
containers = ["platform_api.access"]
layers = [
  "router | repositories",
  "service",
  "interfaces : schemas",
  "models",
]

[[tool.importlinter.contracts]]
name = "servers: layers (router, repositories, integrations -> service -> interfaces, schemas -> models)"
type = "layers"
containers = ["platform_api.servers"]
layers = [
  "router | repositories | integrations",
  "service",
  "interfaces : schemas",
  "models",
]

[[tool.importlinter.contracts]]
name = "agent: layers (router, repositories, integrations -> service -> interfaces, schemas -> models)"
type = "layers"
containers = ["platform_api.agent"]
layers = [
  "router | repositories | integrations",
  "service",
  "interfaces : schemas",
  "models",
]

[[tool.importlinter.contracts]]
name = "chat: layers (router, repositories, integrations -> service -> interfaces, schemas -> models)"
type = "layers"
containers = ["platform_api.chat"]
layers = [
  "router | repositories",
  "service",
  "interfaces : schemas",
  "models",
]

[[tool.importlinter.contracts]]
name = "approval: layers (router, repositories, integrations -> service -> interfaces, schemas -> models)"
type = "layers"
containers = ["platform_api.approval"]
layers = [
  "router | repositories",
  "service",
  "interfaces : schemas",
  "models",
]

[[tool.importlinter.contracts]]
name = "tools: layers (router, repositories, integrations -> service -> interfaces, schemas -> models)"
type = "layers"
containers = ["platform_api.tools"]
layers = [
  "router | repositories | integrations",
  "service",
  "interfaces : schemas",
  "catalog",
  "rules : masking",
  "models",
]

[[tool.importlinter.contracts]]
name = "models are plain Python: no frameworks, no database, no network"
type = "forbidden"
source_modules = [
  "platform_api.access.models",
  "platform_api.servers.models",
  "platform_api.agent.models",
  "platform_api.chat.models",
  "platform_api.approval.models",
  "platform_api.tools.models",
  "platform_api.tools.catalog",
  "platform_api.tools.rules",
  "platform_api.tools.masking",
]
forbidden_modules = [
  "fastapi",
  "starlette",
  "pydantic",
  "uvicorn",
  "sqlalchemy",
  "alembic",
  "psycopg",
  "yaml",
  "docker",
  "httpx",
  "mcp",
  "asyncssh",
]

[[tool.importlinter.contracts]]
name = "services, schemas and interfaces know no web framework, database library or network client"
type = "forbidden"
source_modules = [
  "platform_api.access.service",
  "platform_api.access.schemas",
  "platform_api.access.interfaces",
  "platform_api.servers.service",
  "platform_api.servers.schemas",
  "platform_api.servers.interfaces",
  "platform_api.agent.service",
  "platform_api.agent.schemas",
  "platform_api.agent.interfaces",
  "platform_api.chat.service",
  "platform_api.chat.schemas",
  "platform_api.chat.interfaces",
  "platform_api.approval.service",
  "platform_api.approval.schemas",
  "platform_api.approval.interfaces",
  "platform_api.tools.service",
  "platform_api.tools.schemas",
  "platform_api.tools.interfaces",
]
forbidden_modules = [
  "fastapi",
  "starlette",
  "pydantic",
  "uvicorn",
  "sqlalchemy",
  "alembic",
  "psycopg",
  "yaml",
