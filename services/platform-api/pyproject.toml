[project]
name = "platform-api"
version = "0.1.0"
description = "superAI platform API: a modular monolith (access, chat, agent, approval, project, history, skills)."
requires-python = ">=3.11"
dependencies = [
  "starlette>=0.40",
  "uvicorn>=0.30",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "import-linter>=2.1", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

# ---- Architecture rules, checked by `lint-imports` (same rules as server-tools) ----
[tool.importlinter]
root_package = "platform_api"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Every module is layered: adapters -> application -> ports -> domain"
type = "layers"
containers = ["platform_api.access"]
layers = ["adapters", "application", "ports", "domain"]

[[tool.importlinter.contracts]]
name = "Domain is pure: no frameworks, no I/O"
type = "forbidden"
source_modules = ["platform_api.access.domain"]
forbidden_modules = ["starlette", "uvicorn", "yaml"]
