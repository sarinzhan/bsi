# BSI, the whole stack on one machine (local development and trying it out).
#
#   cp .env.example .env              # once; change the values if you like
#   docker compose up -d --build
#   open http://localhost:8080        # web app; API docs at http://localhost:8080/docs
#
# Production on the bsi-app VM: deploy/bsi-app/compose.yml (images from the registry, secrets from Vault,
# agent containers on a separate runner VM).
#
# Networks (who can talk to whom):
#   backend                 postgres, platform-api, web
#   bsi-agent-sandbox   platform-api and the agent containers.
#                           Agent containers can NOT reach postgres or web.
#
# Dev mode on purpose: prod mode needs company SSO (not wired yet).
# In dev, the web app signs you in with the "Viewing as" switcher and the server tools use a fake SSH executor.
# Approvals are real (cards in the chat). Agent runs: none by default (fake sandbox); for real agent
# containers add docker-compose.agents.yml (see that file).

x-hardening: &hardening
  read_only: true                     # nothing in the image can be changed at run time
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "5"}

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: bsi_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-dev-admin}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"         # this machine only (for psql, tests); never the network
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro   # one database + login per service
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsi_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  platform-api:
    <<: *hardening
    build: ./services/platform-api
    image: bsi/platform-api:local
    environment:
      BSI_MODE: dev
      BSI_DATABASE_URL: postgresql://platform:dev-platform@postgres:5432/platform
      BSI_SANDBOX: fake           # starts no containers; docker-compose.agents.yml switches to real ones
      BSI_RUN_TTL_S: "600"
      BSI_LLM: ${BSI_LLM:-anthropic}          # "scripted": a fake model, no key needed
      BSI_MODEL: ${BSI_MODEL:-claude-opus-5-5}
      # No model proxy yet: the key is passed into each agent container (see docs/architecture.md)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BSI_RUN_MCP_URL: http://platform-api:8000/mcp/
      BSI_RUN_PLATFORM_URL: http://platform-api:8000
      # Fixed dev tokens "dev-<system>-<env>" also work at /mcp/, so you can connect your own Claude Code
      # to http://localhost:8000/mcp/ (its approvals are denied: there is no chat to ask in).
      BSI_DEV_TOKENS: "on"
    ports:
      - "127.0.0.1:8000:8000"         # MCP for your own client, API docs; this machine only
    networks: [backend, bsi-agent-sandbox]
    depends_on:
      postgres: {condition: service_healthy}


  web:
    <<: *hardening
    build: ./web
    image: bsi/web:local
    tmpfs: [/tmp, /var/cache/nginx]
    ports:
      - "127.0.0.1:8080:8080"
    networks: [backend]
    depends_on:
      platform-api: {condition: service_healthy}

  agent-runner:                       # build only: docker compose --profile build build agent-runner
    profiles: [build]
    build: {context: ., dockerfile: services/agent-runner/Dockerfile}
    image: bsi/agent-runner:local

volumes:
  pgdata:

networks:
  backend:
  bsi-agent-sandbox:
    name: bsi-agent-sandbox       # fixed name: platform-api starts agent containers on it
    # Not internal while there is no model proxy: agent containers call api.anthropic.com themselves.
    # With a model proxy in platform-api this becomes internal: true again (no internet).
    internal: false
