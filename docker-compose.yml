# superAI, the whole stack on one machine (local development and trying it out).
#
#   cp .env.example .env              # once; change the values if you like
#   docker compose up -d --build
#   open http://localhost:8080        # web app; API docs at http://localhost:8080/docs
#
# Production on the bsi-app VM: deploy/bsi-app/compose.yml (images from the registry, secrets from Vault,
# agent containers on a separate runner VM).
#
# Networks (who can talk to whom):
#   backend                 postgres, platform-api, server-tools, web
#   superai-agent-sandbox   platform-api, server-tools and the agent containers. internal = no internet.
#                           Agent containers can NOT reach postgres or web.
#
# Dev mode on purpose: prod mode needs company SSO (not wired yet) and the approval module (next step).
# In dev, the web app signs you in with the "Viewing as" switcher, server-tools uses a fake SSH executor
# and answers approvals itself, and platform-api starts no real agent containers.

x-hardening: &hardening
  read_only: true                     # nothing in the image can be changed at run time
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "5"}

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: superai_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-dev-admin}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"         # this machine only (for psql, tests); never the network
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro   # one database + login per service
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superai_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  platform-api:
    <<: *hardening
    build: ./services/platform-api
    image: superai/platform-api:local
    environment:
      SUPERAI_MODE: dev
      SUPERAI_DATABASE_URL: postgresql://platform:dev-platform@postgres:5432/platform
      SUPERAI_SERVICE_TOKEN: ${SUPERAI_SERVICE_TOKEN:?set it in .env}
      SUPERAI_SANDBOX: fake           # starts no containers (see "real agent containers" at the end)
      SUPERAI_RUN_MCP_URL: http://server-tools:8100/mcp/
      SUPERAI_RUN_PLATFORM_URL: http://platform-api:8000
    networks: [backend, superai-agent-sandbox]
    depends_on:
      postgres: {condition: service_healthy}

  server-tools:
    <<: *hardening
    build: ./services/server-tools
    image: superai/server-tools:local
    environment:
      SUPERAI_MODE: dev               # fake SSH, approvals answered automatically
      SUPERAI_DATABASE_URL: postgresql://server_tools:dev-server-tools@postgres:5432/server_tools
      SUPERAI_SERVICE_TOKEN: ${SUPERAI_SERVICE_TOKEN:?set it in .env}
      # Run tokens: fixed dev tokens "dev-<system>-<env>" by default, so you can connect your own
      # Claude Code to http://localhost:8100/mcp/ right away. To accept only real run tokens from
      # platform-api (as in prod), uncomment:
      # SUPERAI_PLATFORM_URL: http://platform-api:8000
    ports:
      - "127.0.0.1:8100:8100"         # MCP for local clients; this machine only
    networks: [backend, superai-agent-sandbox]
    depends_on:
      postgres: {condition: service_healthy}

  web:
    <<: *hardening
    build: ./web
    image: superai/web:local
    tmpfs: [/tmp, /var/cache/nginx]
    ports:
      - "127.0.0.1:8080:8080"
    networks: [backend]
    depends_on:
      platform-api: {condition: service_healthy}

volumes:
  pgdata:

networks:
  backend:
  superai-agent-sandbox:
    name: superai-agent-sandbox       # fixed name: platform-api starts agent containers on it
    internal: true

# ---- Real agent containers on this machine (once the agent-runner image exists) ----
# In platform-api above, set:
#     SUPERAI_SANDBOX: docker
#     SUPERAI_AGENT_IMAGE: registry/superai/agent-runner:<version>
#     volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
# LOCAL ONLY: access to the Docker socket is root on this machine. In prod, platform-api controls Docker
# on the separate bsi-runner VM over mutual TLS instead (deploy/bsi-app/compose.yml).
